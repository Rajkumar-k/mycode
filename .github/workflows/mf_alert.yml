name: Mutual Fund Alert

on:
  schedule:
    # 9:00 PM IST = 15:30 UTC
    - cron: "30 15 * * 1-5"

  workflow_dispatch:

jobs:
  run-mf-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r mf_alert_app/requirements.txt

      - name: Run mutual fund script
        run: |
          python mf_alert_app/main.py

      - name: Check output
        run: |
          ls -lh mf_alert_app/output.csv

      - name: Commit output CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mf_alert_app/output.csv

          git diff --cached --quiet || git commit -m "Update mutual fund output"

          git push
